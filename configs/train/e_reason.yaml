# E_reason: STEM reasoning expert (self-distilled, rejection-sampled). Frozen before training.
expert: e_reason
base_model: /home/tianlix/interview/models/Qwen3.6-35B-A3B@995ad96e   # Qwen/Qwen3.6-35B-A3B @ 995ad96e
train_file: data/reason/sft_train.jsonl
val_file: data/reason/sft_val.jsonl
output_dir: checkpoints/e_reason
seed: 42
max_len: 20480            # prompt + thinking + answer; generation capped at 16384 new tokens
lora_rank: 16
lora_alpha: 32
lr: 5.0e-5                # low LR: small task vector -> less interference when merging
warmup_ratio: 0.05
epochs: 2
grad_accum: 16            # 16 examples per optimizer step (batch size 1 per micro-step)
max_grad_norm: 1.0
eval_every: 10
save_every: 50
weights_per_gpu: 24GiB
