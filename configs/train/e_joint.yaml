# CONTROL (single-model joint training): ONE LoRA on the union of both experts' training sets with the same
# per-example exposure (reasoning set twice = its 2 epochs, agent set once = its 1 epoch) and identical hyper-
# parameters. Compared with the merged experts on the same dev metrics ("multi-expert merge vs joint training").
expert: e_joint
base_model: /home/tianlix/interview/models/Qwen3.6-35B-A3B@995ad96e   # Qwen/Qwen3.6-35B-A3B @ 995ad96e
train_file: data/joint/sft_train.jsonl
val_file: data/joint/sft_val.jsonl
output_dir: checkpoints/e_joint
seed: 42
max_len: 20480
lora_rank: 16
lora_alpha: 32
lr: 5.0e-5
warmup_ratio: 0.05
epochs: 1                 # 7.8M forward tokens/epoch (~1.5h on 3x A6000)
grad_accum: 16
max_grad_norm: 1.0
eval_every: 20
save_every: 50
weights_per_gpu: 24GiB
