# E_agent: terminal/agent expert. TMax trajectories (Qwen3.6-27B, verifier-successful) re-rendered as Terminus-2
# dialogues; one target turn per example (history without reasoning). Frozen before training.
expert: e_agent
base_model: /home/tianlix/interview/models/Qwen3.6-35B-A3B@995ad96e   # Qwen/Qwen3.6-35B-A3B @ 995ad96e
train_file: data/agent/sft_train.jsonl
val_file: data/agent/sft_val.jsonl
output_dir: checkpoints/e_agent
seed: 42
max_len: 16384
lora_rank: 16
lora_alpha: 32
lr: 5.0e-5
warmup_ratio: 0.05
epochs: 1                 # 7.8M forward tokens/epoch (~1.5h on 3x A6000)
grad_accum: 16
max_grad_norm: 1.0
eval_every: 20
save_every: 40
weights_per_gpu: 24GiB
