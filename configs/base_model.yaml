# Pinned before any training. Do not change during the experiment.
base_model:
  repo: Qwen/Qwen3.6-35B-A3B
  revision: 995ad96eacd98c81ed38be0c5b274b04031597b0
  architecture: Qwen3_5MoeForConditionalGeneration   # 35.95B total, ~3B active, 256 routed experts (8 active) + 1 shared
  dtype: bfloat16                                     # no quantization for any evaluated model
  tokenizer: same repo/revision
  chat_template: tokenizer_config.json at the pinned revision
serving:
  engine: vllm==0.30.0
  tensor_parallel: 2          # 2x H100-80GB on Modal
  max_model_len: 262144
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder
  thinking: enabled           # same for all models in every benchmark
  preserve_thinking: TBD      # fix per benchmark before baseline run
